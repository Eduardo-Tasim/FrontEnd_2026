<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container{
            width: 400px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            margin-bottom: 20px;
            color: #333;
        }

        p{
            margin-bottom: 20px;
            color: #555;
        }

        input{
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #008cdd;
        }

        #resultado{
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .valido{
            color: green;
        }

        .invalido{
            color: red;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Validador de CPF</h1>

        <p>Digite um CPF para validar.</p>

        <input type="text" id="cpf" placeholder="Digite o CPF">

        <button onclick="validarCPF()">
            Validar CPF
        </button>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>

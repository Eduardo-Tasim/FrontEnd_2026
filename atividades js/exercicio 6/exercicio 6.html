<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento de Evento</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 420px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Orçamento de Evento</h2>

        <label for="pacote">Escolha o pacote:</label>

        <select id="pacote">
            <option value="50">Standard - R$ 50 por pessoa</option>
            <option value="80">Premium - R$ 80 por pessoa</option>
            <option value="120">Infinity Deluxe - R$ 120 por pessoa</option>
        </select>

        <label for="quantidade">Quantidade de pessoas:</label>

        <input type="number" id="quantidade" placeholder="Digite a quantidade">

        <button id="calcular">Calcular Orçamento</button>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>

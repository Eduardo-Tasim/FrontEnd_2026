<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Convidados VIP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            width: 450px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .area-input {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .btn-adicionar {
            background-color: #007bff;
        }

        .btn-concluir {
            background-color: #28a745;
        }

        .btn-editar {
            background-color: #ffc107;
            color: black;
        }

        .btn-excluir {
            background-color: #dc3545;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #f9f9f9;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.1);
        }

        .riscado {
            text-decoration: line-through;
            color: gray;
        }

        .botoes {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Infinity Bank - Lista de Convidados VIP</h2>

        <div class="area-input">
            <input type="text" id="nomeConvidado" placeholder="Digite o nome">
            <button class="btn-adicionar" id="adicionar">Adicionar</button>
        </div>

        <ul id="listaConvidados"></ul>
    </div>

    <script src="script.js"></script>

</body>
</html>

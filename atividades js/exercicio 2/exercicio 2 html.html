<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Dinâmico</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container{
            width: 400px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            margin-bottom: 25px;
            color: #333;
        }

        .campo{
            margin-bottom: 20px;
            text-align: left;
        }

        label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input{
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus{
            border-color: #ff758c;
        }

    </style>
</head>
<body>

    <div class="container">

        <h1>Conversor de Temperatura</h1>

        <div class="campo">
            <label for="celsius">Celsius (°C)</label>

            <input 
                type="number"
                id="celsius"
                step="0.1"
                placeholder="Digite em Celsius"
            >
        </div>

        <div class="campo">
            <label for="fahrenheit">Fahrenheit (°F)</label>

            <input 
                type="number"
                id="fahrenheit"
                step="0.1"
                placeholder="Digite em Fahrenheit"
            >
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
